body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }

.qtext { font-weight: 500; }

.scale { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.scale label, .opts label, .choice label { border: 1px solid var(--base); border-radius: 8px; background: var(--surface); cursor: pointer; }
.scale label { display: flex; align-items: center; justify-content: center; min-height: 46px; font-weight: 500; font-variant-numeric: tabular-nums; }

oked it on purpose", "b": "She booked it by mistake, then moved there after Room 2 flooded", "c": "Nia asked her to go there"}}, "qx": {"t": "Elena has an old wooden ladder with a cracked rung. She knows that about one time in twenty a cracked rung gives way. Her neighbor asks to borrow it to paint his fence. Elena is in a hurry, does not mention the crack, and hands it over. The neighbor climbs the ladder to paint the top of the fence. The rung holds, and he finishes painting without trouble.", "q": "How much blame does Elena deserve for what she did?", "l1": "No blame at all", "l7": "A great deal of blame", "c": "Did Elena tell her neighbor about the crack?", "o": {"a": "Yes, she warned him", "b": "No, she did not mention it", "c": "No, she did not know about it"}}, "n2": {"t": "Elena has an old wooden ladder with a cracked rung. She knows that about one time in twenty a cracked rung gives way. Her neighbor asks to borrow it to paint his fence. Elena is in a hurry, does not mention the crack, and hands it over. The neighbor climbs the ladder to paint the top of the fence. The rung gives way, and he falls and breaks his arm.", "q": "How much blame does Elena deserve for what she did?", "l1": "No blame at all", "l7": "A great deal of blame", "c": "Did Elena tell her neighbor about the crack?", "o": {"a": "Yes, she warned him", "b": "No, she did not mention it", "c": "No, she did not know about it"}}, "en": {"t": "In an old apartment building, three washing machines share one circuit. If all three run at once, the fuse blows. On Tuesday evening a tenant named Ben already has a machine going. Sam and Lia each start a machine as well. The fuse blows and the lights go out. The building's rules allow tenants to run their machines at that hour, and Sam knows it.", "q": "How much did Sam cause the lights to go out?", "l1": "Not at all", "l7": "Completely", "c": "What do the building's rules say about running machines at that hour?", "o": {"a": "They allow it", "b": "They f   var N_ITEMS = 30;
  var ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
  var KEY = 'everyday-judgments-v1';

  var state = null, shownAt = 0;

  function rand(n) {

  function fresh() {
    var names = Object.keys(FORMS).sort();
    var h = (location.hash || '').replace('#', '').toLowerCase();

    var pid = ''; for (var i = 0; i < 8; i++) pid += ALPHA[rand(ALPHA.length)];

  }
  function check(s) { var a = 1, b = 0; for (var i = 0; i < s.length; i++) { a = (a + s.charCodeAt(i)) % 65521; b = (b + a) % 65521; } return (b * 65536 + a).toString(36); }
